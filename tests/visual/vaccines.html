 button('Editar programación',row('Vacuna demostración')).click();await wait(()=>field('Nombre de vacuna *'));fill(field('Nombre de vacuna *'),'Vacuna revisada');fill(field('Fecha programada *'),today);fill(field('Observaciones e indicaciones (opcional)'),'Indicaciones revisadas áéíóúñ');await tick();button('Guardar',document.querySelector('[role=dialog]')).click();await wait(()=>!document.querySelector('[role=dialog]')&&!document.querySelector('.vax-loading'));await wait(()=>row('Vacuna revisada'));assert(dose.idVacuna===id&&dose.proximaDosis===today&&dose.observaciones.includes('áéíóúñ'),'Una edición cambia nombre fecha y notas conservando ID');

 if(new URLSearchParams(location.search).has('shell')){document.querySelector('[aria-label^="Notificaciones,"]').click();await wait(()=>document.querySelector('a[href*="vacunas?paciente=1"]'));assert(document.body.textContent.includes('Refuerzo próximo'),'Campanita muestra aviso interno del paciente');button('Marcar como leído').click();await wait(()=>!button('Marcar como leído'));document.querySelector('[aria-label="Actualizar avisos"]').click();await wait(()=>!document.querySelector('[aria-label="Actualizar avisos"]').disabled);assert(!button('Marcar como leído'),'Lectura se conserva después de volver a consultar');document.querySelector('a[href*="vacunas?paciente=1"]').click();await wait(()=>!document.querySelector('[aria-label="Cerrar avisos"]'));assert(document.querySelector('.vax-page.owner'),'Enlace abre Mis vacunas sin escritura clínica')}
